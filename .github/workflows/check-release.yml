name: Check prebuilt release integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python tools
        run: python -m compileall -q src scripts
      - name: Check cooked payload hashes and resource structure
        run: python scripts/check_release.py
# No game installation or in-game playtest runs in this workflow.
